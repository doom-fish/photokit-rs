[package]
name = "photokit"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/doom-fish/photokit-rs"
repository = "https://github.com/doom-fish/photokit-rs"
description = "Safe Rust bindings for Apple's Photos framework — photo library access on macOS"
authors = ["Per Johansson <per@doom.fish>"]
keywords = ["photos", "photokit", "macos", "apple", "photo-library"]
categories = ["api-bindings", "os::macos-apis"]
rust-version = "1.70"
readme = "README.md"
build = "build.rs"
include = [
    "src/**/*",
    "swift-bridge/Package.swift",
    "swift-bridge/Sources/**/*",
    "examples/**/*",
    "tests/**/*",
    "build.rs",
    "Cargo.toml",
    "COVERAGE.md",
    "README.md",
    "LICENSE-*",
    "CHANGELOG.md",
]

[lints.rust]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

[lib]
name = "photokit"
crate-type = ["lib"]

[features]
default = []
async = []

[dependencies]
base64 = "0.22"
doom-fish-utils = { path = "../doom-fish-utils", version = "0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
pollster = "0.3"

[package.metadata.docs.rs]
all-features = true
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[[example]]
name = "01_photokit_smoke"

[[example]]
name = "16_async_api"
required-features = ["async"]

[profile.release]
debug = "full"
strip = "none"
